name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets deploy.yml run the same checks before it deploys

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_DEBUG: "0"

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Catches a broken Dockerfile before it reaches ECR. Nothing is pushed here.
      - name: Build the image
        run: docker build --platform linux/amd64 -t simple-crud-api:ci .
